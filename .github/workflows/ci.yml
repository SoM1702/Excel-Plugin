name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend test suite
        run: python -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend

  addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: addin/package-lock.json
      - name: Install add-in dependencies
        run: npm ci
        working-directory: addin
      - name: Run add-in tests
        run: npm test
        working-directory: addin
      - name: Validate development manifest
        run: npm run validate
        working-directory: addin
      - name: Build and validate production deployment manifest
        run: |
          node configure-url.js https://team.example.com/addin https://api.example.com/v1 "Production Team" https://team.example.com/support
          node validate-manifest.js dist/manifest.prod.xml
        working-directory: addin
